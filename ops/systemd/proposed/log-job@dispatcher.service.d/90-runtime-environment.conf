[Service]
# Authoritative alerting/runtime configuration for a *job* process.
#
# Why this exists as a drop-in rather than only in the base unit: the units that
# raise incidents from inside a job (`log-workflow-b.service`,
# `log-job@.service`) were installed without any EnvironmentFile=, while the
# units that *deliver* alerts (`suspected-bug-email-worker.service`,
# `execution-watchdog.service`, `log-platform-unit-failure@.service`) were
# installed with it. `SUSPECTED_BUG_ALERT_TO` lives only in
# /etc/log-platform/runtime.env, which is root:root 0600 — a job process cannot
# read it itself, so systemd injecting it before dropping privileges is the only
# supply route. The result was that every incident raised from inside a job
# resolved zero recipients and was persisted with
# email_decision='suppressed', email_decision_reason='recipients_not_configured',
# while the coarse systemd unit-level alert was the only thing ever delivered.
#
# `log-job@retention-purge.service` and the repository's
# `log-job@dispatcher.service` already carry exactly these two lines. This
# drop-in retrofits the same contract onto units that are already installed
# without them, without rewriting the installed base unit.
#
# EnvironmentFile= accumulates, so declaring the same path here and in a base
# unit is idempotent: identical assignments applied twice.
#
# Order matters and matches every other unit on this host: runtime.env first,
# environment-identity.env second, so the canonical environment identity always
# wins over any stale copy left in runtime.env.
EnvironmentFile=/etc/log-platform/runtime.env
EnvironmentFile=/etc/log-platform/environment-identity.env
