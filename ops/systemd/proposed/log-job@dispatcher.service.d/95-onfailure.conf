[Unit]
# Route unit-level failure into the operator alert path. This covers executions
# that die before they can register a platform run — the failure class that
# previously existed only in journald.
#
# OnFailure= is a [Unit] directive. Under [Service] systemd ignores it with only
# an "Unknown key name" warning, which would leave this whole routing silently
# inert — exactly the failure mode this milestone exists to remove.
OnFailure=log-platform-unit-failure@%n.service
