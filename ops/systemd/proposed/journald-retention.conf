# Repository-managed journald retention. Install as
#   /etc/systemd/journald.conf.d/10-log-platform-retention.conf
# then `systemctl restart systemd-journald` — both are host mutations and are
# NOT performed by the change that added this file.
#
# WHY THIS FILE EXISTS. This host had no `MaxRetentionSec` at all: journal
# retention was bounded only by disk pressure. Disk size is not a time-retention
# policy — a quieter host keeps entries longer, and platform unit logs carry
# client codes, e-mail addresses and error payloads, so they are squarely inside
# the owner's 13-calendar-month ceiling.
#
# WHY THE NUMBERS ARE WHAT THEY ARE. journald cannot express calendar months;
# `MaxRetentionSec=` is a fixed duration. A fixed duration is only safe if it can
# never exceed 13 calendar months for ANY calendar start date, so the value is
# derived from the SHORTEST span 13 calendar months can have — 393 days — rather
# than from an average or a "13 * 30" approximation, both of which exceed the
# ceiling for some start dates.
#
# Two deductions are then made, because vacuuming is FILE-granular, not
# entry-granular:
#
#   MaxFileSec=7d       the active journal file is never vacuumed. Bounding how
#                       long one file stays writable bounds how much older than
#                       the retention window an entry can be. Without it, a
#                       low-traffic host can keep one file open for months and
#                       every entry in it survives regardless of MaxRetentionSec.
#
#   1 day               the enforcement itself is periodic:
#                       `journald-retention-vacuum.timer` runs daily so a host
#                       quiet enough never to rotate still enforces the ceiling.
#
#   393d - 7d - 1d  =  385d
#
# The derivation lives in `ops.retention_registry.journald_max_retention()` and
# `ops/tests_manual/test_journald_retention.py` fails if this file and that
# function ever disagree. Do not hand-edit the numbers.
#
# SHORTER IS ALLOWED. If an operator wants a shorter journal history, lower
# these values; the ceiling is a maximum. Do not raise them.

[Journal]
MaxRetentionSec=385d
MaxFileSec=7d
