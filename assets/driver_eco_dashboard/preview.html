<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Podgląd stanów — Driver Eco Dashboard (dane syntetyczne)</title>
<link rel="stylesheet" href="./css/dashboard.css">
<style>
  /* Harness chrome only — deliberately not part of the product. The dashboard
     owns the whole viewport (the slide stage is 100vh with the document
     clipped), so the harness floats above it instead of taking layout space. */
  .harness {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; background: #101828; color: #E4E7EC; padding: 10px 18px;
    font: 12px/1.4 system-ui, sans-serif;
  }
  .harness strong { color: #FF9A3D; letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
  .harness select, .harness a { font: inherit; }
  .harness select { padding: 6px 8px; border-radius: 8px; border: 1px solid #344054; background: #1D2939; color: #F9FAFB; }
  .harness a { color: #FF9A3D; }
</style>
</head>
<body>
<div class="harness">
  <strong>Podgląd stanów · dane wyłącznie syntetyczne · nie jest częścią produktu</strong>
  <label>Stan
    <select id="fixture-select"></select>
  </label>
  <span id="harness-note"></span>
  <a href="./index.html">produkcyjna powłoka →</a>
</div>
<div id="eco-root"></div>
<script src="./js/format.js"></script>
<script src="./js/render.js"></script>
<script src="./js/snapshot-source.js"></script>
<script src="./js/app.js"></script>
<script>
(function () {
  var FIXTURES = [
    "ranked_acceptable", "ranked_safe", "ranked_dangerous",
    "not_ranked_by_configuration", "not_on_roster", "newly_ranked", "left_ranking",
    "insufficient_period_distance", "report_not_ready", "no_comparison",
    "first_closed_period_of_month", "end_of_month_period", "skipped_period_in_series",
    "monthly_without_previous_month",
    "zero_event_category", "no_driving_day", "monthly_31_days"
  ];
  var select = document.getElementById("fixture-select");
  FIXTURES.forEach(function (name) {
    var option = document.createElement("option");
    option.value = name; option.textContent = name;
    select.appendChild(option);
  });
  var params = new URLSearchParams(location.search);
  var initial = params.get("fixture");
  if (FIXTURES.indexOf(initial) < 0) initial = FIXTURES[0];
  select.value = initial;

  /* The frozen integration boundary, and nothing else: exactly the call
     js/boot.js makes in production. `boot` mounts once per page, so switching
     state reloads rather than re-mounting — the entrance animations, the slide
     route and the once-per-visit motion then behave as they do for a driver. */
  function mount(name) {
    var source = window.EcoSnapshotSource.createFixtureSource({ name: name });
    var note = document.getElementById("harness-note");
    var seen = source.load;
    source.load = function () {
      return seen.call(source).then(function (result) {
        note.textContent = result && result.ok ? "" : "stan dostępu: " +
          (result && result.code ? result.code : "SERVICE_UNAVAILABLE");
        return result;
      });
    };
    window.EcoApp.boot({ source: source });
  }
  select.addEventListener("change", function () {
    var url = new URL(location.href);
    url.searchParams.set("fixture", select.value);
    url.hash = "";
    location.assign(url.toString());
  });
  mount(initial);
})();
</script>
</body>
</html>
